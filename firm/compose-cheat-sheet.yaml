# BIG PICTURE
# One Postgres 16 database with the pgvector extension, for local development.
# The Next.js app runs on the host (`pnpm dev`) and connects to this container
# at 127.0.0.1:5433. One database holds both relational tables and embeddings,
# so "which chunks may this user see" is a single SQL query.
#
# Usage (from firm/):
#   docker compose config      # parse + show resolved values (no daemon needed)
#   docker compose up -d       # start in the background
#   docker compose ps          # shows "healthy" once the healthcheck passes
#   docker compose logs -f db  # follow logs
#   docker compose down        # stop + remove container (data volume stays)
#   docker compose down -v     # ...and DELETE the data volume
#
# There is no `version:` key. It was required by Compose v1 and is ignored
# (with a warning) by Compose v2, which is what ships with Docker today.

name: firm # project name; prefixes container/volume/network names (firm-db-1, firm_pgdata)

services:
  db: # service name; also its DNS hostname on the Compose network
    image: pgvector/pgvector:pg16 # postgres:16 + the pgvector extension files

    # `environment:` sets variables inside the container. The postgres image reads
    # these ONLY when it initializes an empty data directory (first start).
    # Changing them later does not change an existing database.
    # `${VAR:-default}`: use $VAR from the shell or ./.env, else the default.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firm_dev} # required by the image
      POSTGRES_DB: ${POSTGRES_DB:-firm}

    # `ports:` is "HOST:CONTAINER". Host port 5433 because a local Postgres
    # already owns 5432. The 127.0.0.1 prefix binds to loopback only; without it
    # Docker publishes on every network interface.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

    # `volumes:` entries are "SOURCE:TARGET". A name (pgdata) is a Docker-managed
    # named volume (right for databases). A path (./init:/...) is a bind mount of
    # a host folder. The top-level `volumes:` block below declares the named one.
    volumes:
      - pgdata:/var/lib/postgresql/data

    # Healthcheck: a command run INSIDE the container. Exit 0 = healthy.
    # `$$` stops Compose from interpolating on the host; the container's shell
    # expands ${POSTGRES_USER} instead.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s # run every 5s
      timeout: 3s # a run taking longer than this counts as a failure
      retries: 10 # this many consecutive failures => "unhealthy"
      start_period: 10s # failures during the first 10s don't count

    # no (default) | always | on-failure | unless-stopped
    # unless-stopped: restart after crashes and reboots, but not after `docker compose stop`.
    restart: unless-stopped

    # --- REFERENCE: valid keys not used here (delete this block any time) ---
    # container_name: firm-db       # fixed name; blocks `--scale` and clashes across projects
    # command: ["postgres", "-c", "max_connections=200"]   # overrides the image's CMD
    # entrypoint: ["/custom-entrypoint.sh"]                # overrides the image's ENTRYPOINT
    # env_file: [.env]              # load a file's variables INTO the container
    #                               # (different from ./.env, which only feeds ${...} interpolation)
    # build:                        # build an image instead of pulling one
    #   context: .                  #   folder sent to the builder
    #   dockerfile: Dockerfile
    #   target: runner              #   stop at this stage of a multi-stage Dockerfile
    #   args: { NODE_ENV: production }
    # depends_on:                   # startup order between services
    #   db:
    #     condition: service_healthy   # wait for the healthcheck, not just "started"
    # networks: [backend]           # attach to named networks (declare top-level)
    # profiles: ["tools"]           # only start with `docker compose --profile tools up`
    # shm_size: 256mb               # /dev/shm size; Postgres parallel queries can need more than 64MB
    # mem_limit: 1g                 # hard memory cap (also deploy.resources.limits.memory)
    # cpus: 2                       # CPU cap
    # stop_grace_period: 30s        # time between SIGTERM and SIGKILL on stop
    # init: true                    # tiny init process reaps zombie processes
    # tmpfs: [/tmp]                 # in-memory mount, gone on stop
    # user: "1000:1000"             # run as this uid:gid instead of the image default
    # read_only: true               # read-only root filesystem
    # cap_drop: [ALL]               # drop Linux capabilities
    # logging:
    #   driver: json-file
    #   options: { max-size: "10m", max-file: "3" }
    # labels: { com.firm.role: "database" }
    # extra_hosts: ["host.docker.internal:host-gateway"]   # reach services on the host

# Top-level blocks declare things services refer to by name.
volumes:
  pgdata: # empty value = default driver, Docker picks the storage location
